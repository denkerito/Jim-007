[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jim007-telegram-bot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "python-telegram-bot>=21.10,<23",
]

[tool.setuptools.packages.find]
include = ["app*"]

name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://contract:contract@127.0.0.1:1/contract
      INTERNAL_API_TOKEN: integration-secret
      GEMINI_API_KEY: contract-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install ".[test]"
      - run: pytest

  telegram-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/telegram-bot/pyproject.toml
      - run: python -m pip install ".[test]"
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: services/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      INTERNAL_API_TOKEN: ci-internal-token
      SESSION_SECRET: ci-session-secret-at-least-32-bytes
      CSRF_SECRET: ci-csrf-secret-different-at-least-32-bytes
      TELEGRAM_BOT_TOKEN: 123456:ci-placeholder-token
      TELEGRAM_BOT_USERNAME: jim007_ci_bot
      GEMINI_API_KEY: ci-gemini-key
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api bot web
